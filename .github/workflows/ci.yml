name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same Node (and npm) as local development: the lockfile is written
          # by npm 11, and npm 10 (Node 22) rejects it in `npm ci`.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:fsd
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same Node (and npm) as local development: the lockfile is written
          # by npm 11, and npm 10 (Node 22) rejects it in `npm ci`.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Auth and Storage stay on: they create auth.users columns and
      # storage tables that the migrations use.
      - name: Start Supabase
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
      - run: npx supabase db lint --level error --fail-on error
      - run: npm run test:db
